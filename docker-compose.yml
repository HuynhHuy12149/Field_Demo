version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    # Dành cho MacOS/Windows, giúp hot-reload mượt hơn nếu mount code (nếu cần)

  web:
    build:
      context: ./field-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Browser sẽ gọi API qua port 7860 đã được expose
      - NEXT_PUBLIC_API_URL=http://localhost:7860/api
    depends_on:
      - api
