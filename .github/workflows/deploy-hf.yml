name: Build and Deploy to HF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      # === BUILD FRONTEND (NEXT.JS) ===
      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: 3. Build Next.js
        working-directory: ./field-web
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

      # === BUILD BACKEND (.NET) ===
      - name: 4. Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: 5. Build .NET Backend
        run: dotnet publish ./FieldServiceAPI/FieldServiceAPI.csproj -c Release -o ./publish_folder

      # === GOM HÀNG & ĐẨY QUA HF ===
      - name: 6. Gộp Next.js vào wwwroot của .NET
        run: |
          mkdir -p ./publish_folder/wwwroot
          cp -r ./field-web/out/* ./publish_folder/wwwroot/
          # Tạo bản sao dạng thư mục/index.html cho mỗi trang để hỗ trợ cả 2 kiểu URL
          for html_file in ./publish_folder/wwwroot/*.html; do
            page=$(basename "$html_file" .html)
            if [ "$page" != "index" ] && [ "$page" != "404" ] && [ "$page" != "_not-found" ]; then
              mkdir -p "./publish_folder/wwwroot/$page"
              cp "$html_file" "./publish_folder/wwwroot/$page/index.html"
            fi
          done

      - name: 7. Đưa Dockerfile và cấu hình README vào thư mục thành phẩm
        run: |
          cp Dockerfile.hf ./publish_folder/Dockerfile
          cp README.md ./publish_folder/README.md

      - name: 8. Deploy thư mục thành phẩm sang Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd publish_folder
          git init -b main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git lfs install
          git lfs track "*.dll"
          git lfs track "*.woff2"
          git lfs track "*.ico"
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force https://huynhhuy12149:$HF_TOKEN@huggingface.co/spaces/huynhhuy12149/fieldserviceapi main
